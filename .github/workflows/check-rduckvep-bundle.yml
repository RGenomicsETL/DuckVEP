name: Check Rduckvep bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Check r/Rduckvep/inst/duckvep_extension bundle is in sync
        run: scripts/check-rduckvep-bundle.sh
