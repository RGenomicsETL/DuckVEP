name: Check Rduckvep bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
      - name: Check r/Rduckvep/inst/duckvep_extension bundle is in sync
        run: scripts/check-rduckvep-bundle.sh
