name: Haplotype contract

on:
  push:
    branches: [main]
    paths:
      - 'test/data/haplotype/**'
      - 'test/scripts/*haplotype*'
      - 'test/scripts/*same_codon*'
      - 'test/scripts/*frame*'
      - 'src/**'
      - 'test/duckvep/conformance/noncoding_haplotype_runtime.R'
      - 'test/duckvep/conformance/noncoding_indel_runtime.R'
      - 'Makefile'
      - '.github/workflows/haplotype-contract.yml'
  pull_request:
    paths:
      - 'test/data/haplotype/**'
      - 'test/scripts/*haplotype*'
      - 'test/scripts/*same_codon*'
      - 'test/scripts/*frame*'
      - 'src/**'
      - 'test/duckvep/conformance/noncoding_haplotype_runtime.R'
      - 'test/duckvep/conformance/noncoding_indel_runtime.R'
      - 'Makefile'
      - '.github/workflows/haplotype-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The Makefile includes extension-ci-tools unconditionally.
          submodules: true
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - name: Install DuckDB runtime test dependencies
        run: Rscript --vanilla -e 'install.packages(c("DBI", "duckdb"), repos = Sys.getenv("RSPM"))'
      - name: Check the csq mapping, goldens and accounting (offline, base R)
        run: make test_haplotype_contract
      - name: Check the bounded noncoding haplotype runtime
        run: make test_noncoding_haplotype_runtime
