name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@3dc5c2a2754227219f4b532b4b5f940158a26925 # v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: 3dc5c2a2754227219f4b532b4b5f940158a26925 # v1.5.6
      extension_name: duckvep
      extra_toolchains: python3
      exclude_archs: windows_amd64;windows_arm64
      reduced_ci_mode: disabled
