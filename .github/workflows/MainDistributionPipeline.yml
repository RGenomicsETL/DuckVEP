name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.0
    with:
      duckdb_version: v1.5.0
      ci_tools_version: v1.5.0
      extension_name: duckvep
      extra_toolchains: python3
      exclude_archs: windows_amd64;windows_arm64
      reduced_ci_mode: disabled
