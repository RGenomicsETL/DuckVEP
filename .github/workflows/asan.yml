name: SQL tests under sanitizers

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'test/sql/**'
      - 'Makefile'
      - 'test/scripts/test_fault_injection.py'
      - 'scripts/check_v2_hg002*.sh'
      - 'benchmarks/benchmark_duckvep_vep_rs*.sh'
      - '.github/workflows/asan.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'test/sql/**'
      - 'Makefile'
      - 'test/scripts/test_fault_injection.py'
      - 'scripts/check_v2_hg002*.sh'
      - 'benchmarks/benchmark_duckvep_vep_rs*.sh'
      - '.github/workflows/asan.yml'

permissions:
  contents: read

jobs:
  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The Makefile includes extension-ci-tools unconditionally.
          submodules: true
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake zlib1g-dev
      - name: Build with ASan+UBSan and run the SQL suite (any sanitizer report fails)
        run: make test_release_asan

  fault-injection:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DUCKDB_CLI_VERSION: v1.5.1
      DUCKDB_CLI_SHA256: 7414b29d4e77ae833ff170a489a59b74331f96d3fde72aa3bb8437dedbcea180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake zlib1g-dev shellcheck jq
      - name: Install the pinned DuckDB CLI
        run: |
          curl -sSfL -o duckdb_cli.zip "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_CLI_VERSION}/duckdb_cli-linux-amd64.zip"
          echo "${DUCKDB_CLI_SHA256}  duckdb_cli.zip" | sha256sum -c -
          unzip -q duckdb_cli.zip -d "$RUNNER_TEMP/duckdb-cli"
          echo "$RUNNER_TEMP/duckdb-cli" >> "$GITHUB_PATH"
      - name: Check benchmark and scale runner contracts
        run: make test_runner_contracts
      - name: Fail every load and annotation allocation in turn (each must be a clean, leak-free error)
        run: make test_fault_injection
