name: Check Rduckvep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        shell: bash
        run: Rscript -e 'install.packages(c("DBI", "duckdb", "tinytest"))'
      - name: Build package
        shell: bash
        run: R CMD build r/Rduckvep
      - name: Check package
        shell: bash
        run: R CMD check --no-manual Rduckvep_0.1.0.tar.gz
