name: Check Rduckvep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      MAKEFLAGS: -j2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/Rduckvep
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r/Rduckvep
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"warning"'

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build webR binary in Emscripten toolchain
        run: |
          docker run --rm -v "$PWD:/project:ro" -w /tmp ghcr.io/r-wasm/webr:latest \
            sh -c 'mkdir -p /tmp/output && Rscript -e '\''rwasm::build("/project/r/Rduckvep", out_dir="/tmp/output", dependencies=FALSE)'\'' && test -f /tmp/output/Rduckvep_*.tgz &&
              mkdir /tmp/unpacked && tar -xzf /tmp/output/Rduckvep_*.tgz -C /tmp/unpacked &&
              python3 /project/test/scripts/check_wasm_exports.py "$(find /tmp/unpacked -name duckvep.duckdb_extension | head -n 1)"'
