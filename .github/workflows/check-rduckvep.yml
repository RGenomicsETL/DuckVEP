name: Check Rduckvep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      MAKEFLAGS: -j2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: r/Rduckvep
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: r/Rduckvep
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"warning"'
      - name: Check host recovery and snapshot validation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -t artifacts < <(find . -path '*/Rduckvep.Rcheck/Rduckvep/duckvep_extension/artifacts/*/duckvep.duckdb_extension')
          test "${#artifacts[@]}" -eq 1
          bash test/scripts/test_host_oom.sh "${artifacts[0]}"
          timeout -k 2 120 Rscript test/scripts/check_projection_parallel.R "${artifacts[0]}"
          DUCKVEP_RNA_TEST_EXTENSION="${artifacts[0]}" timeout -k 2 120 Rscript test/duckvep/conformance/rna_snapshot.R

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build webR binary in Emscripten toolchain
        run: |
          # ghcr.io/r-wasm/webr:latest
          docker run --rm -v "$PWD:/project:ro" -w /tmp ghcr.io/r-wasm/webr@sha256:3fbf3dc3537c5b31bca94dd797dc25364693b18d71b1d0975f318fbfd6269d86 \
            sh -c 'mkdir -p /tmp/output && Rscript -e '\''rwasm::build("/project/r/Rduckvep", out_dir="/tmp/output", dependencies=FALSE)'\'' && test -f /tmp/output/Rduckvep_*.tgz &&
              mkdir /tmp/unpacked && tar -xzf /tmp/output/Rduckvep_*.tgz -C /tmp/unpacked &&
              python3 /project/test/scripts/check_wasm_exports.py "$(find /tmp/unpacked -name duckvep.duckdb_extension | head -n 1)"'
