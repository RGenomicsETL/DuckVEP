name: DuckVEP build provenance
on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'third_party/**'
      - 'duckdb_capi/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'test/duckvep/conformance/data/conformance_history.csv'
      - '.github/workflows/duckvep-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev libcurl4-openssl-dev libdeflate-dev liblzma-dev libssl-dev zlib1g-dev
      - name: Build and test independent extension
        run: |
          make configure
          make release test_release
      - name: Record source, binary and evidence hashes
        run: |
          git rev-parse HEAD > build/release/source_revision.txt
          sha256sum build/release/duckvep.duckdb_extension \
            test/duckvep/conformance/data/conformance_history.csv \
            benchmarks/data/duckvep_throughput.csv > build/release/provenance.sha256
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: build/release/duckvep.duckdb_extension
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: duckvep-provenance
          path: |
            build/release/duckvep.duckdb_extension
            build/release/source_revision.txt
            build/release/provenance.sha256
