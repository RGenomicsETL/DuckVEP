name: MANE GRCh37 policy
on:
  push:
    paths:
      - 'scripts/mane_grch37_policy.R'
      - 'scripts/build_mane_grch37.R'
      - 'test/scripts/test_mane_grch37_*.R'
      - 'Makefile'
      - '.github/workflows/mane-grch37-policy.yml'
  pull_request:
    paths:
      - 'scripts/mane_grch37_policy.R'
      - 'scripts/build_mane_grch37.R'
      - 'test/scripts/test_mane_grch37_*.R'
      - 'Makefile'
      - '.github/workflows/mane-grch37-policy.yml'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The Makefile includes extension-ci-tools unconditionally.
          submodules: true
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - name: Install fixture dependencies
        run: |
          Rscript -e 'install.packages(c("data.table", "BiocManager"))'
          Rscript -e 'BiocManager::install("Biostrings", ask = FALSE, update = FALSE)'
      - name: Test MANE policy
        run: make test_mane_grch37
